# Nginx Configuration for Stresser with Cloudflare
# Domain: yourdomain.com (replace with your actual domain)
# Backend: http://localhost:3000
# Cloudflare Proxy: Enabled (orange cloud)

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    
    # Logs
    access_log /var/log/nginx/stresser-access.log;
    error_log /var/log/nginx/stresser-error.log;
    
    # Increase body size for file uploads
    client_max_body_size 10M;
    
    # Proxy to Next.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # Important for cookie secure flag
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;  # Cloudflare real IP
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

